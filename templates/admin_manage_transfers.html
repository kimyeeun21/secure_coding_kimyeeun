{% extends "base.html" %}
{% block title %}송금 내역 관리{% endblock %}
{% block content %}
<h2>송금 내역</h2>
<ul>
  {% for t in transfers %}
    <li>{{ t.sender }} → {{ t.receiver }} : {{ t.amount }}원 ({{ t.timestamp }})</li>
  {% endfor %}
</ul>
<a href="{{ url_for('admin_panel') }}">← 관리자 홈으로</a>
{% endblock %}
