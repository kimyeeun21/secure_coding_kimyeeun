{% extends "base.html" %}
{% block title %}1:1 채팅{% endblock %}
{% block content %}
<h2>{{ receiver.username }}님과의 채팅</h2>

<div style="border:1px solid #ccc; padding:10px; height:300px; overflow-y:scroll;">
  {% for msg in messages %}
    <p><strong>{{ '나' if msg.sender_id == session['user_id'] else receiver.username }}:</strong> {{ msg.message }}</p>
  {% endfor %}
</div>

<form method="POST">
  <input type="text" name="message" required style="width:80%">
  <button type="submit">전송</button>
</form>
{% endblock %}
