{% extends "base.html" %}
{% block title %}마이 페이지지{% endblock %}
{% block content %}
<h2>마이페이지</h2>

<form method="POST">
  <label>소개글:</label><br>
  <textarea name="bio">{{ user.bio }}</textarea><br><br>

  <h3>비밀번호 변경</h3>
  <label>현재 비밀번호:</label><br>
  <input type="password" name="current_password"><br>

  <label>새 비밀번호:</label><br>
  <input type="password" name="new_password"><br><br>

  <button type="submit">저장</button>
</form>
{% endblock %}
